<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13112a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="팻 서바이벌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>팻 서바이벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-column game shell — sticky resource bar + tabs, one panel at a time, max 720px */
:root{
  --night:#13112a; --night2:#1c1840; --panel:#221e48; --panel2:#2d2860; --line:#423c80;
  --ink:#f1ecff; --muted:#a9a2d6; --gold:#ffcf4d; --gem:#62e4ff; --hp:#ff5d78; --ok:#5fe394; --danger:#ff6b6b;
  --g-n:#a3a8bd; --g-r:#55d68f; --g-rr:#58aeff; --g-sr:#c773ff; --g-mr:#ffb43d; --g-my:#ff4d6d; --g-lm:#fff27a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night) 70%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.02em;background:linear-gradient(90deg,var(--gold),#ff9f6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.res{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.chip.coin b{color:var(--gold);font-weight:400}.chip.gem b{color:var(--gem);font-weight:400}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-bottom:8px}
.tab{position:relative;border:0;background:transparent;padding:8px 2px;border-radius:10px;font-family:var(--display);font-size:15px;color:var(--muted)}
.tab span{display:block;font-size:20px;line-height:1.1}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.dot{position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hp)}

main{padding-block:18px 40px}
.panel{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-size:18px;background:linear-gradient(180deg,#ffd866,#f5a623);color:#2b1a00;box-shadow:0 3px 0 #b36b00}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b36b00}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 #15122e}
.btn.sm{font-size:15px;padding:8px 12px}

/* pet avatar */
.av{--el:#888;position:relative;display:grid;place-items:center;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--el) 45%,white),var(--el) 45%,color-mix(in srgb,var(--el) 45%,black));
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.08),var(--aura,0 0 0 transparent)}
.av-emo{line-height:1}
.av.sm{width:56px;height:56px;font-size:30px}.av.md{width:96px;height:96px;font-size:54px}.av.lg{width:132px;height:132px;font-size:76px}
.acc{position:absolute;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.acc-head{top:-18%;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:.55em}
.acc-face{top:34%;left:50%;transform:translateX(-50%);font-size:.45em}
.acc-hand{bottom:-6%;right:-8%;font-size:.45em}
.acc-aura{bottom:-6%;left:-6%;font-size:.38em}
.unknown .av{--el:#3a3566}.unknown .av-emo{filter:brightness(0) opacity(.45)}

.grade{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--display);font-size:13px;color:#14122b;letter-spacing:.03em}
.g-N{background:var(--g-n)}.g-R{background:var(--g-r)}.g-RR{background:var(--g-rr)}.g-SR{background:var(--g-sr)}
.g-MR{background:linear-gradient(90deg,var(--g-mr),#ff6ba8,var(--g-sr))}
.g-MY{background:linear-gradient(90deg,var(--g-my),#ff9a3d);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 0 10px var(--g-my)}
.g-LM{background:linear-gradient(90deg,var(--g-lm),#7af0ff,#ff8af0,var(--g-lm));background-size:200% 100%;animation:shine 2.5s linear infinite;box-shadow:0 0 12px var(--g-lm)}
@keyframes shine{to{background-position:200% 0}}

/* battle */
.stagebar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stagebar h2{font-size:26px}
.arena{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);padding:18px 14px;
  background:linear-gradient(180deg,#2a2463 0%,#3b2f6e 55%,#2c4a3a 56%,#1f3529 100%);display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:280px}
.fighter{display:grid;justify-items:center;align-content:center;gap:8px;position:relative;min-width:0}
.fighter.mon{align-self:start}.fighter.pet{align-self:end}
.mon-emo{font-size:84px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.fname{font-family:var(--display);font-size:16px;text-align:center}
.hpbar{width:100%;max-width:170px;height:12px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),#ff9a6b);transition:width .2s}
.pet .hpbar i{background:linear-gradient(90deg,var(--ok),#b6f36b)}
.hptxt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
.float{position:absolute;left:50%;top:20%;font-family:var(--display);font-size:26px;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 0 #000;white-space:nowrap}
.float.big{font-size:36px;color:var(--gold)}.float.hurt{color:var(--hp)}
@keyframes up{from{transform:translate(-50%,0) scale(1.2);opacity:1}to{transform:translate(-50%,-60px) scale(1);opacity:0}}
.hit{animation:hit .3s}@keyframes hit{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lunge{animation:lunge .3s}@keyframes lunge{50%{transform:translate(14px,-14px) scale(1.08)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:flash .5s forwards}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:rgba(14,12,34,.78);backdrop-filter:blur(2px);padding:16px}
.over h3{font-size:34px}
.skills{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.skill{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 8px;text-align:center;min-height:78px;display:grid;align-content:center;gap:2px}
.skill .k{position:absolute;top:4px;left:7px;font-size:11px;color:var(--muted)}
.skill .n{font-family:var(--display);font-size:16px;line-height:1.2}
.skill .d{font-size:12px;color:var(--muted)}
.skill.ult{background:linear-gradient(160deg,#5a2d8a,#2d2860);border-color:var(--g-sr)}
.skill.ult .n{color:var(--gold)}
.skill .cd{position:absolute;inset:0;background:conic-gradient(rgba(8,6,20,.72) var(--p,0deg),transparent 0);display:grid;place-items:center;font-family:var(--display);font-size:24px;pointer-events:none}
.skill:disabled{cursor:not-allowed}
.bitems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bitem{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:1px;text-align:center}
.bitem .k{position:absolute;top:3px;left:7px;font-size:11px;color:var(--muted)}
.bitem .ie{font-size:22px;line-height:1.1}.bitem .n{font-family:var(--display);font-size:14px}.bitem .c{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.bitem:disabled{opacity:.45;cursor:not-allowed}
.buffs{position:absolute;top:8px;left:8px;display:grid;gap:4px;font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums;pointer-events:none}
.buffs span{background:rgba(10,8,28,.7);border-radius:999px;padding:2px 10px}
.warn{font-family:var(--display);font-size:14px;color:var(--gold);min-height:1.3em;animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.4}}
.float.block{color:var(--gem);font-size:22px}
.fighter.shielded .av{box-shadow:0 0 0 5px var(--gem),0 0 26px 8px color-mix(in srgb,var(--gem) 60%,transparent)}
.fighter.powered .av{filter:drop-shadow(0 0 14px var(--gold)) saturate(1.4)}
.coupon{display:grid;gap:8px}
.coupon .row{flex-wrap:nowrap}
.coupon input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;letter-spacing:.05em}
.coupon input:focus-visible{outline:3px solid var(--gem);outline-offset:1px}
.field{position:relative;width:min(100%,440px,calc((100dvh - 330px) * 0.947));min-width:min(100%,260px);margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#22402e}
.field canvas{display:block;width:100%;height:auto;aspect-ratio:360/380;touch-action:none}
.field .buffs{top:44px}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:440px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.joy{position:relative;flex:none;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,var(--panel2),var(--panel));border:2px solid var(--line);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:linear-gradient(180deg,#5a52a8,#3b3670);border:2px solid var(--muted);box-shadow:0 4px 10px rgba(0,0,0,.4);pointer-events:none}
.atk{display:flex;align-items:flex-end;gap:10px}
.atk .col{display:grid;gap:10px;justify-items:center}
.abtn{position:relative;overflow:hidden;border-radius:50%;border:2px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:6px;touch-action:none;-webkit-user-select:none;user-select:none}
.abtn .in{position:relative;z-index:1;display:grid;gap:1px;justify-items:center;text-align:center}
.abtn .n{font-family:var(--display);font-size:12px;line-height:1.15;word-break:keep-all}
.abtn .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.abtn.s1{width:100px;height:100px;background:linear-gradient(180deg,#ffd866,#f5a623);color:#2b1a00;border-color:#b36b00}
.abtn.s1 .n{font-size:14px}.abtn.s1 .d{color:#6b4300}
.abtn.s2{width:74px;height:74px}
.abtn.ult{width:84px;height:84px;--g:0;background:conic-gradient(var(--gold) calc(var(--g)*1%),#1a1738 0);border-color:var(--g-sr)}
.abtn.ult::before{content:"";position:absolute;inset:6px;border-radius:50%;background:linear-gradient(160deg,#5a2d8a,#2d2860)}
.abtn.ult .n{color:var(--gold)}
.abtn.ult.ready{animation:pulse .8s infinite alternate;box-shadow:0 0 18px 4px var(--gold)}
@keyframes pulse{to{transform:scale(1.06)}}
.abtn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.abtn .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(8,6,20,.65) var(--p,0deg),transparent 0);pointer-events:none;z-index:2}
@media (max-width:380px){.joy{width:112px;height:112px}.abtn.s1{width:88px;height:88px}.abtn.ult{width:74px;height:74px}.abtn.s2{width:64px;height:64px}}
.empty{text-align:center;display:grid;gap:12px;justify-items:center;padding:32px 16px}

/* eggs */
.eggs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.eggs{grid-template-columns:1fr}}
.egg{display:grid;gap:10px;justify-items:center;text-align:center}
.egg-ico{font-size:72px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.egg.premium{background:linear-gradient(170deg,#3d2a6b,var(--panel));border-color:var(--g-sr)}
.egg.premium .egg-ico{filter:drop-shadow(0 0 16px var(--g-mr)) hue-rotate(200deg) saturate(2)}
.rates{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px}
.rates span{display:inline-flex;gap:4px;align-items:center}

/* collection */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pcell{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 4px 8px;display:grid;justify-items:center;gap:5px;text-align:center;position:relative}
.pcell .nm{font-family:var(--display);font-size:14px;line-height:1.2}
.pcell .cnt{position:absolute;top:4px;right:6px;font-size:12px;color:var(--muted)}
.pcell.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.pcell.unknown{cursor:default;opacity:.75}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}

/* shop */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 8px;display:grid;justify-items:center;gap:6px;text-align:center}
.item .ie{font-size:40px;line-height:1}
.item .nm{font-family:var(--display);font-size:15px}
.item .slot{font-size:12px;color:var(--muted)}

/* daily */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 2px;display:grid;gap:4px;justify-items:center;text-align:center;font-variant-numeric:tabular-nums}
.day .dn{font-family:var(--display);font-size:15px}
.day .rw{font-size:12px;color:var(--gold)}
.day .st{font-size:18px;height:22px}
.day.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.day.done{background:color-mix(in srgb,var(--ok) 18%,var(--panel2))}
.day.sun{background:linear-gradient(180deg,#5a3a10,var(--panel2))}
.day.sun.done{background:color-mix(in srgb,var(--ok) 25%,#5a3a10)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,5,16,.7);padding:16px}
.sheet{width:min(460px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head h3{font-size:24px}
.sklist{display:grid;gap:6px}
.sk{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}
.sk b{font-family:var(--display);font-weight:400;font-size:15px}
.sk.ult b{color:var(--gold)}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.eqgrid button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px;font-size:24px}
.eqgrid button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hatch{display:grid;justify-items:center;gap:12px;text-align:center;padding:10px 0}
.hatch .egg-ico{font-size:96px;animation:wob .25s infinite alternate}
@keyframes wob{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.reveal{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.2);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-family:var(--display);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">팻 서바이벌</div>
      <div class="res">
        <span class="chip coin">🪙 <b id="coins">0</b></span>
        <span class="chip gem">💎 <b id="gems">0</b></span>
        <span class="chip">⚔️ <b id="stg" style="font-weight:400">1</b>층</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="battle"><span>⚔️</span>전투</button>
      <button class="tab" role="tab" data-tab="eggs"><span>🥚</span>알 부화</button>
      <button class="tab" role="tab" data-tab="pets"><span>🐾</span>내 펫</button>
      <button class="tab" role="tab" data-tab="shop"><span>🛍️</span>상점</button>
      <button class="tab" role="tab" data-tab="daily"><span>📅</span>출석</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- data ----------
const GRADES = {
  N:  {name:'노멀',       mult:1.0, hp:50},
  R:  {name:'레어',       mult:1.3, hp:60},
  RR: {name:'레어레어',   mult:1.7, hp:75},
  SR: {name:'슈퍼레어',   mult:2.2, hp:95},
  MR: {name:'마스터레어', mult:2.8, hp:120},
  MY: {name:'신화', mult:3.5, hp:150},
  LM: {name:'레전드 마스터', mult:4.3, hp:180},
};
const ELEM = {불:'#ff7a45',물:'#4fb3ff',풀:'#5bd17a',땅:'#c49a6c',바람:'#8fe3cf',번개:'#ffd84d',얼음:'#a8e6ff',빛:'#fff0a0',어둠:'#8a6bd8'};
const PETS = [
  [1,'솜뭉치','🐑','N','바람',['솜털 박치기','폭신 회오리','구름 폭탄']],
  [2,'도토리쥐','🐿️','N','땅',['도토리 던지기','앞니 갉기','도토리 소나기']],
  [3,'이슬개구리','🐸','N','물',['혀 채찍','물방울 튕기기','연못 대해일']],

function addFx(x, y, text, color, size=20){ B.fx.push({x, y, text, color, size, t:0}); }

// 이동 입력: 조이스틱 + 키보드
function moveInput(){
  let x = joy.x, y = joy.y;
  if (keys.has('a') || keys.has('arrowleft')) x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup')) y -= 1;
  if (keys.has('s') || keys.has('arrowdown')) y += 1;
  const l = Math.hypot(x, y);
  return l > 1 ? {x:x/l, y:y/l} : {x, y};
}
function bindControls(){
  const pad = $('#joy'), knob = $('#knob');
  const set = e => {
    const r = pad.getBoundingClientRect(), max = r.width/2 - 14;
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const l = Math.hypot(dx, dy); if (l > max){ dx *= max/l; dy *= max/l; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx/max; joy.y = dy/max;
  };
  const end = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; pad.setPointerCapture(e.pointerId); set(e); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === joy.id) set(e); });
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  [0,1].forEach(i => {
    const b = $('#sk'+i);
    b.addEventListener('pointerdown', e => { e.preventDefault(); B.hold[i] = true; useSkill(i); });
    ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, () => { B.hold[i] = false; }));
  });
  $('#sk2').addEventListener('pointerdown', e => { e.preventDefault(); useSkill(2); });
}

function loop(now){
  if (!B.running) return;
  const dt = Math.min(0.05, (now - B.last) / 1000); B.last = now;
  const m = monFor(S.stage), P = B.pet, M = B.mon, def = now < B.defUntil;

  // 펫 이동
  const v = moveInput();
  P.x = Math.max(PET_R, Math.min(W-PET_R, P.x + v.x*PET_SPEED*dt));
  P.y = Math.max(PET_R+30, Math.min(H-PET_R, P.y + v.y*PET_SPEED*dt));

  // 누르고 있으면 연사
  [0,1].forEach(i => { if (B.hold[i] || keys.has(['j','k'][i]) || keys.has(['1','2'][i])) useSkill(i); });

  // 보스 이동: 펫 주변을 돌며 거리를 두거나, 가끔 돌진
  if (now >= M.retarget){
    const ang = Math.random()*Math.PI*2, dist = 110 + Math.random()*90;
    M.tx = Math.max(MON_R, Math.min(W-MON_R, P.x + Math.cos(ang)*dist));
    M.ty = Math.max(MON_R+30, Math.min(H-MON_R, P.y + Math.sin(ang)*dist));
    M.retarget = now + 1300 + Math.random()*1200;
  }
  const mspd = Math.min(85, 40 + S.stage*0.8), dx = M.tx - M.x, dy = M.ty - M.y, dl = Math.hypot(dx, dy);
  if (dl > 2){ M.x += dx/dl*Math.min(dl, mspd*dt); M.y += dy/dl*Math.min(dl, mspd*dt); }

  // 보스 공격
  if (now >= B.nextAtk){
    B.nextAtk = now + MON_INT; B.hits += 1;
    if (B.hits % STRONG_EVERY === 0){
      B.zones.push({x:P.x, y:P.y, r:62, at:now+900, dur:900, dmg:Math.round(m.atk*STRONG_MULT)});
      addFx(M.x, M.y-44, '강공격!', '#ffcf4d', 18);
    } else {
      const n = S.stage >= 20 ? 4 : S.stage >= 8 ? 2 : 1, base = Math.atan2(P.y-M.y, P.x-M.x), spd = Math.min(300, 170 + S.stage*2.5);
      for (let k = 0; k < n; k++){
        const a = base + (k - (n-1)/2) * 0.26;
        B.bullets.push({x:M.x, y:M.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:8, dmg:m.atk});
      }
    }
  }
  const hurtPet = (dmg, big) => {
    if (def){ addFx(P.x, P.y-30, '🛡️ 막음', '#62e4ff', 16); return; }
    const d = Math.round(dmg * (0.85 + Math.random()*0.3));
    P.hp -= d; P.hurt = now; addFx(P.x, P.y-30, (big?'💥-':'-') + d, '#ff5d78', big ? 26 : 20);
  };
  B.bullets = B.bullets.filter(b => {
    b.x += b.vx*dt; b.y += b.vy*dt;
    if (Math.hypot(b.x-P.x, b.y-P.y) < PET_R + b.r){ hurtPet(b.dmg); return false; }
    return b.x > -20 && b.x < W+20 && b.y > -20 && b.y < H+20;
  });
  B.zones = B.zones.filter(z => {
    if (now < z.at) return true;
    if (Math.hypot(z.x-P.x, z.y-P.y) < z.r + PET_R*0.5) hurtPet(z.dmg, true);
    B.fx.push({ring:true, x:z.x, y:z.y, r:z.r, t:0});
    return false;
  });
  // 몸통 박치기
  if (Math.hypot(M.x-P.x, M.y-P.y) < PET_R + MON_R - 4 && now >= B.contactAt){ B.contactAt = now + 700; hurtPet(m.atk*0.5); }

  // 펫 탄
  B.shots = B.shots.filter(s => {
    s.x += s.vx*dt; s.y += s.vy*dt; s.d += Math.hypot(s.vx, s.vy)*dt;
    if (Math.hypot(s.x-M.x, s.y-M.y) < MON_R + s.r){ hitMon(s.dmg, false); B.gauge = Math.min(100, B.gauge + s.gain); return false; }
    return s.d < s.range;
  });
  B.fx = B.fx.filter(f => (f.t += dt) < (f.ring ? .35 : .9));

  if (P.hp <= 0){ P.hp = 0; B.running = false; B.result = 'lose'; drawField(now); drawOverlay(); drawHud(now); return; }
  if (M.hp <= 0) return win(now);
  drawField(now); drawHud(now);
  B.raf = requestAnimationFrame(loop);
}
function hitMon(dmg, big){
  const M = B.mon; M.hp -= dmg; M.hurt = performance.now();
  addFx(M.x + (Math.random()*20-10), M.y-40, (big?'⚡':'-') + dmg, big ? '#ffcf4d' : '#ffffff', big ? 32 : 20);
}
function win(now){
  B.mon.hp = 0; B.running = false; B.result = 'win';
  const rw = rewardFor(S.stage); S.coins += rw.coins; S.gems += rw.gems; S.stage += 1; save(); hud();
  drawField(now); drawHud(now);
  const h = $('.stagebar h2'); if (h) h.textContent = `스테이지 ${S.stage-1} 클리어`;
  drawOverlay();
}
function useSkill(i){
  if (!B.running) return;
  const now = performance.now(), s = skills(PET[S.active])[i], mult = now < B.atkUntil ? 2 : 1;
  const dmg = Math.round(s.dmg * mult * (0.9 + Math.random()*0.2));
  if (i === 2){
    if (B.gauge < 100) return;
    B.gauge = 0; hitMon(dmg, true);
    B.fx.push({ring:true, x:B.mon.x, y:B.mon.y, r:90, t:0, color:ELEM[PET[S.active].el], big:true});
    if (B.mon.hp <= 0) win(now);
    return;
  }
  if (now < B.ready[i]) return;
  const c = SHOT[i]; B.ready[i] = now + c.cd*1000;
  const P = B.pet, M = B.mon, a = Math.atan2(M.y-P.y, M.x-P.x);
  B.shots.push({x:P.x, y:P.y, vx:Math.cos(a)*c.speed, vy:Math.sin(a)*c.speed, r:c.r, d:0, range:c.range, dmg, gain:c.gain, big:i===1});
}

// ---------- 그리기 ----------
function drawField(now){
  if (!ctx || !B.pet) return;
  const c = ctx, P = B.pet, M = B.mon, p = PET[S.active], m = monFor(S.stage), el = ELEM[p.el];
  c.clearRect(0,0,W,H);
  c.fillStyle = '#22402e'; c.fillRect(0,0,W,H);
  c.fillStyle = '#274a34';
  for (let y = 0; y < H; y += 40) for (let x = (y/40)%2 ? 40 : 0; x < W; x += 80) c.fillRect(x, y, 40, 40);
  // 사거리 표시
  c.setLineDash([4,6]); c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1.5;
  c.beginPath(); c.arc(P.x, P.y, SHOT[0].range, 0, Math.PI*2); c.stroke(); c.setLineDash([]);
  // 강공격 경고 원
  B.zones.forEach(z => {
    const k = Math.min(1, 1 - (z.at - now)/z.dur);
    c.fillStyle = 'rgba(255,60,90,.16)'; c.strokeStyle = 'rgba(255,80,100,.9)'; c.lineWidth = 2;
    c.beginPath(); c.arc(z.x, z.y, z.r, 0, Math.PI*2); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,60,90,.35)'; c.beginPath(); c.arc(z.x, z.y, z.r*k, 0, Math.PI*2); c.fill();
  });
  // 그림자
  c.fillStyle = 'rgba(0,0,0,.3)';
  c.beginPath(); c.ellipse(M.x, M.y+MON_R-2, MON_R*.9, 8, 0, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(P.x, P.y+PET_R-2, PET_R*.8, 6, 0, 0, Math.PI*2); c.fill();
  // 보스
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
  if (now - M.hurt < 120) c.globalAlpha = .55;
  c.fillStyle = '#fff'; c.font = `60px ${EMOJI_FONT}`; c.fillText(m.emo, M.x, M.y + Math.sin(now/180)*2);
  c.restore();
  // 펫
  const it = ITEM[S.equip[p.id]];
  c.save();
  if (now < B.atkUntil){ c.shadowColor = '#ffcf4d'; c.shadowBlur = 22; }
  else if (it && it.slot === 'aura'){ c.shadowColor = it.glow; c.shadowBlur = 20; }
  c.fillStyle = el; c.beginPath(); c.arc(P.x, P.y, PET_R, 0, Math.PI*2); c.fill();
  c.restore();
  c.strokeStyle = now - P.hurt < 150 ? '#ff5d78' : 'rgba(255,255,255,.7)'; c.lineWidth = 2.5;
  c.beginPath(); c.arc(P.x, P.y, PET_R, 0, Math.PI*2); c.stroke();
  if (now < B.defUntil){ c.strokeStyle = '#62e4ff'; c.lineWidth = 4; c.beginPath(); c.arc(P.x, P.y, PET_R+7, 0, Math.PI*2); c.stroke(); }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = '#fff'; c.font = `28px ${EMOJI_FONT}`; c.fillText(p.emo, P.x, P.y+1);
  if (it && it.slot !== 'aura'){
    c.font = `16px ${EMOJI_FONT}`;
    const pos = {head:[0,-PET_R-4], face:[0,2], hand:[PET_R-2,PET_R-4]}[it.slot];
    c.fillText(it.emo, P.x+pos[0], P.y+pos[1]);
  }
  // 펫 탄
  B.shots.forEach(s => {
    c.fillStyle = el; c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(s.x, s.y, s.r*.45, 0, Math.PI*2); c.fill();
  });
  // 보스 탄
  B.bullets.forEach(b => {
    c.fillStyle = '#b44dff'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, Math.PI*2); c.fill();
    c.fillStyle = '#ffd1ff'; c.beginPath(); c.arc(b.x, b.y, b.r*.45, 0, Math.PI*2); c.fill();
  });
  // 체력바
  const bar = (x, y, w, h, k, col) => {
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(x, y, w, h);
    c.fillStyle = col; c.fillRect(x+1, y+1, Math.max(0, (w-2)*k), h-2);
  };
  bar(12, 10, W-24, 14, M.hp/M.max, '#ff5d78');
  c.fillStyle = '#fff'; c.font = '13px "Jua",sans-serif'; c.textAlign = 'left';
  c.fillText(`${m.name}`, 16, 34);
  c.textAlign = 'right'; c.fillText(`HP ${Math.max(0,Math.ceil(M.hp))} / ${M.max}`, W-16, 34);
  bar(P.x-28, P.y-PET_R-16, 56, 7, P.hp/P.max, '#5fe394');
  // 효과
  c.textAlign = 'center';
  B.fx.forEach(f => {
    if (f.ring){
      c.strokeStyle = f.color || 'rgba(255,90,110,.9)'; c.lineWidth = f.big ? 6 : 4; c.globalAlpha = 1 - f.t/.35;
      c.beginPath(); c.arc(f.x, f.y, f.r*(.5 + f.t/.35*.6), 0, Math.PI*2); c.stroke(); c.globalAlpha = 1;
      return;
    }
    c.globalAlpha = Math.max(0, 1 - f.t/.9);
    c.font = `${f.size}px "Jua",${EMOJI_FONT}`; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.7)';
    c.strokeText(f.text, f.x, f.y - f.t*50); c.fillStyle = f.color; c.fillText(f.text, f.x, f.y - f.t*50);
    c.globalAlpha = 1;
  });
}
function drawHud(now){
  [0,1].forEach(i => {
    const cd = $('#cd'+i), btn = $('#sk'+i); if (!cd) return;
    const left = B.running ? Math.max(0, B.ready[i] - now) : 0;
    cd.style.setProperty('--p', (left / (SHOT[i].cd*1000) * 360) + 'deg');
    btn.disabled = !B.running;
  });
  const u = $('#sk2');
  if (u){
    const g = B.gauge || 0;
    u.style.setProperty('--g', g);
    u.classList.toggle('ready', B.running && g >= 100);
    u.disabled = !B.running;
    $('#gaugeTxt').textContent = g >= 100 ? '사용 가능!' : Math.floor(g) + '%';
  }
  drawItems(now);
}
function drawItems(now){
  BATTLE_ITEMS.forEach(it => {
    const btn = $('#bi-'+it.id); if (!btn) return;
    $('#bic-'+it.id).textContent = '×' + (S.inv[it.id]||0);
    btn.disabled = !B.running || !(S.inv[it.id] > 0);
  });
  const def = B.running ? Math.max(0, B.defUntil - now) : 0, atk = B.running ? Math.max(0, B.atkUntil - now) : 0;
  const bf = $('#buffs');
  if (bf) bf.innerHTML = (def ? `<span>🛡️ 방어 ${(def/1000).toFixed(1)}초</span>` : '') + (atk ? `<span>💪 공격 ×2 ${(atk/1000).toFixed(1)}초</span>` : '');
}
function useItem(id){
  const it = BITEM[id];
  if (!B.running || !it || !(S.inv[id] > 0)) return;
  const now = performance.now();
  S.inv[id] -= 1; save();
  if (it.kind === 'def') B.defUntil = Math.max(now, B.defUntil) + it.sec*1000;
  else B.atkUntil = Math.max(now, B.atkUntil) + it.sec*1000;
  addFx(B.pet.x, B.pet.y-34, it.emo + ' ' + it.name, '#62e4ff', 16);
  drawItems(now);
}
const GAME_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','j','k','1','2'];
document.addEventListener('keydown', e => {
  if (tab !== 'battle' || !$('#modal').hidden || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (GAME_KEYS.includes(k)){ keys.add(k); if (B.running) e.preventDefault(); }
  if (k === 'l' || k === '3') useSkill(2);
  if (['4','5','6'].includes(k)) useItem(BATTLE_ITEMS[+k - 4].id);
  if (k === ' ' && !B.running && PET[S.active]){ e.preventDefault(); startBattle(); }
});
document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

function hatch(k){
  const e = EGGS[k]; if (S.coins < e.price) return toast('코인이 부족해요');
  S.coins -= e.price;
  let r = Math.random(), g = e.rates[e.rates.length-1][0];
  for (const [gr,p] of e.rates){ if (r < p){ g = gr; break; } r -= p; }
  const choices = PETS.filter(p => p.grade === g);
  const pet = choices[Math.floor(Math.random()*choices.length)];
  const isNew = !S.pets[pet.id];
  S.pets[pet.id] = (S.pets[pet.id] || 0) + 1;
  if (!S.active) S.active = pet.id;
  save(); hud(); renderEggs();
  openModal(`<div class="hatch" id="hatchBox"><div class="egg-ico" ${k==='premium'?'style="filter:hue-rotate(200deg) saturate(2) drop-shadow(0 0 16px var(--g-mr))"':''}>🥚</div><div class="sub">알이 흔들려요…</div></div>`);
  setTimeout(() => {
    const box = $('#hatchBox'); if (!box) return;
    box.innerHTML = `<div class="reveal">${avatar(pet,'lg',S.equip[pet.id])}</div>
      <div>${gradeTag(pet.grade)} ${isNew ? '<span class="grade" style="background:var(--hp)">NEW</span>' : ''}</div>
      <h3 style="font-size:28px">${pet.name}</h3>
      <div class="sub">${isNew ? '새로운 펫을 얻었어요!' : `이미 가진 펫이에요 (보유 ${S.pets[pet.id]})`}</div>
      <div class="row" style="justify-content:center">
        ${S.coins >= e.price ? `<button class="btn" data-hatch="${k}">한 번 더 (🪙${e.price})</button>` : ''}
        <button class="btn alt" data-close>확인</button>
      </div>`;
  }, 1200);
}

    <form class="card coupon" id="couponForm">
      <h3 style="font-size:18px">쿠폰 입력</h3>
      <p class="sub">받은 쿠폰 코드를 입력하면 보상을 받아요. 쿠폰마다 한 번만 쓸 수 있어요.</p>
      <div class="row"><input id="couponCode" autocomplete="off" autocapitalize="characters" placeholder="쿠폰 코드" aria-label="쿠폰 코드">
      <button class="btn sm" type="submit">받기</button></div>
    </form>
  </div>`;
}
const COUPONS = {PET400:{coins:400}};
function redeem(raw){
  const code = raw.trim().toUpperCase().replace(/\s+/g,'');
  const c = COUPONS[code];
  if (!c) return toast('없는 쿠폰 코드예요. 다시 확인해 주세요');
  S.coupons = S.coupons || [];
  if (S.coupons.includes(code)) return toast('이미 사용한 쿠폰이에요');
  S.coupons.push(code); S.coins += c.coins || 0; S.gems += c.gems || 0; save(); renderDaily(); hud();
  toast(`쿠폰 사용 완료! 🪙${c.coins} 받았어요`);
}
document.addEventListener('submit', e => { if (e.target.id === 'couponForm'){ e.preventDefault(); redeem($('#couponCode').value); } });
function claim(){
  if (claimedToday()) return;
  const r = todayReward(); S.daily.days[dayIdx()] = 1; S.coins += r; save(); renderDaily(); hud();
  toast(`출석 완료! 🪙${r} 받았어요`);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.go){ tab = d.go; closeModal(); render(); }
  else if (d.act === 'start') startBattle();
  else if (d.skill) useSkill(+d.skill);
  else if (d.hatch){ closeModal(); hatch(d.hatch); }
  else if (d.filter){ petFilter = d.filter; renderPets(); }
  else if (d.pet) petModal(+d.pet);
  else if (d.activate){ stopBattle(); S.active = +d.activate; save(); closeModal(); renderPets(); toast(`${PET[S.active].name}이(가) 전투에 나가요`); }
  else if (d.equip !== undefined){
    const pid = +$('#modal').dataset.pet, iid = +d.equip;
    if (iid) S.equip[pid] = iid; else delete S.equip[pid];
    save(); petModal(pid); if (tab === 'pets') renderPets();
  }
  else if (d.buy) buy(+d.buy);
  else if (d.bbuy){
    const it = BITEM[d.bbuy]; if (S.coins < it.price) return toast('코인이 부족해요');
    S.coins -= it.price; S.inv[it.id] = (S.inv[it.id]||0) + 1; save(); renderShop(); hud();
    toast(`${it.name} 아이템을 샀어요 (보유 ${S.inv[it.id]}개)`);
  }
  else if (d.use) useItem(d.use);
  else if (d.claim !== undefined) claim();
  else if (d.close !== undefined) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();

// 앱 설치·오프라인 지원
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage?.persist?.(); } catch(e) {}
</script>
