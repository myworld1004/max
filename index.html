<title>팻 서바이벌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-column game shell — sticky resource bar + tabs, one panel at a time, max 720px */
:root{
  --night:#13112a; --night2:#1c1840; --panel:#221e48; --panel2:#2d2860; --line:#423c80;
  --ink:#f1ecff; --muted:#a9a2d6; --gold:#ffcf4d; --gem:#62e4ff; --hp:#ff5d78; --ok:#5fe394; --danger:#ff6b6b;
  --g-n:#a3a8bd; --g-r:#55d68f; --g-rr:#58aeff; --g-sr:#c773ff; --g-mr:#ffb43d;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--night2),var(--night) 70%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gem);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.02em;background:linear-gradient(90deg,var(--gold),#ff9f6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.res{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.chip.coin b{color:var(--gold);font-weight:400}.chip.gem b{color:var(--gem);font-weight:400}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-bottom:8px}
.tab{position:relative;border:0;background:transparent;padding:8px 2px;border-radius:10px;font-family:var(--display);font-size:15px;color:var(--muted)}
.tab span{display:block;font-size:20px;line-height:1.1}
.tab[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.dot{position:absolute;top:6px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hp)}

main{padding-block:18px 40px}
.panel{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-size:18px;background:linear-gradient(180deg,#ffd866,#f5a623);color:#2b1a00;box-shadow:0 3px 0 #b36b00}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b36b00}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 #15122e}
.btn.sm{font-size:15px;padding:8px 12px}

/* pet avatar */
.av{--el:#888;position:relative;display:grid;place-items:center;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--el) 45%,white),var(--el) 45%,color-mix(in srgb,var(--el) 45%,black));
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.08),var(--aura,0 0 0 transparent)}
.av-emo{line-height:1}
.av.sm{width:56px;height:56px;font-size:30px}.av.md{width:96px;height:96px;font-size:54px}.av.lg{width:132px;height:132px;font-size:76px}
.acc{position:absolute;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.acc-head{top:-18%;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:.55em}
.acc-face{top:34%;left:50%;transform:translateX(-50%);font-size:.45em}
.acc-hand{bottom:-6%;right:-8%;font-size:.45em}
.acc-aura{bottom:-6%;left:-6%;font-size:.38em}
.unknown .av{--el:#3a3566}.unknown .av-emo{filter:brightness(0) opacity(.45)}

.grade{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--display);font-size:13px;color:#14122b;letter-spacing:.03em}
.g-N{background:var(--g-n)}.g-R{background:var(--g-r)}.g-RR{background:var(--g-rr)}.g-SR{background:var(--g-sr)}
.g-MR{background:linear-gradient(90deg,var(--g-mr),#ff6ba8,var(--g-sr))}

/* battle */
.stagebar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stagebar h2{font-size:26px}
.arena{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);padding:18px 14px;
  background:linear-gradient(180deg,#2a2463 0%,#3b2f6e 55%,#2c4a3a 56%,#1f3529 100%);display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:280px}
.fighter{display:grid;justify-items:center;align-content:center;gap:8px;position:relative;min-width:0}
.fighter.mon{align-self:start}.fighter.pet{align-self:end}
.mon-emo{font-size:84px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.fname{font-family:var(--display);font-size:16px;text-align:center}
.hpbar{width:100%;max-width:170px;height:12px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),#ff9a6b);transition:width .2s}
.pet .hpbar i{background:linear-gradient(90deg,var(--ok),#b6f36b)}
.hptxt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
.float{position:absolute;left:50%;top:20%;font-family:var(--display);font-size:26px;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 0 #000;white-space:nowrap}
.float.big{font-size:36px;color:var(--gold)}.float.hurt{color:var(--hp)}
@keyframes up{from{transform:translate(-50%,0) scale(1.2);opacity:1}to{transform:translate(-50%,-60px) scale(1);opacity:0}}
.hit{animation:hit .3s}@keyframes hit{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lunge{animation:lunge .3s}@keyframes lunge{50%{transform:translate(14px,-14px) scale(1.08)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:flash .5s forwards}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:rgba(14,12,34,.78);backdrop-filter:blur(2px);padding:16px}
.over h3{font-size:34px}
.skills{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.skill{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 8px;text-align:center;min-height:78px;display:grid;align-content:center;gap:2px}
.skill .k{position:absolute;top:4px;left:7px;font-size:11px;color:var(--muted)}
.skill .n{font-family:var(--display);font-size:16px;line-height:1.2}
.skill .d{font-size:12px;color:var(--muted)}
.skill.ult{background:linear-gradient(160deg,#5a2d8a,#2d2860);border-color:var(--g-sr)}
.skill.ult .n{color:var(--gold)}
.skill .cd{position:absolute;inset:0;background:conic-gradient(rgba(8,6,20,.72) var(--p,0deg),transparent 0);display:grid;place-items:center;font-family:var(--display);font-size:24px;pointer-events:none}
.skill:disabled{cursor:not-allowed}
.empty{text-align:center;display:grid;gap:12px;justify-items:center;padding:32px 16px}

/* eggs */
.eggs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.eggs{grid-template-columns:1fr}}
.egg{display:grid;gap:10px;justify-items:center;text-align:center}
.egg-ico{font-size:72px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.egg.premium{background:linear-gradient(170deg,#3d2a6b,var(--panel));border-color:var(--g-sr)}
.egg.premium .egg-ico{filter:drop-shadow(0 0 16px var(--g-mr)) hue-rotate(200deg) saturate(2)}
.rates{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px}
.rates span{display:inline-flex;gap:4px;align-items:center}

/* collection */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pcell{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 4px 8px;display:grid;justify-items:center;gap:5px;text-align:center;position:relative}
.pcell .nm{font-family:var(--display);font-size:14px;line-height:1.2}
.pcell .cnt{position:absolute;top:4px;right:6px;font-size:12px;color:var(--muted)}
.pcell.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.pcell.unknown{cursor:default;opacity:.75}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}

/* shop */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 8px;display:grid;justify-items:center;gap:6px;text-align:center}
.item .ie{font-size:40px;line-height:1}
.item .nm{font-family:var(--display);font-size:15px}
.item .slot{font-size:12px;color:var(--muted)}

/* daily */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 2px;display:grid;gap:4px;justify-items:center;text-align:center;font-variant-numeric:tabular-nums}
.day .dn{font-family:var(--display);font-size:15px}
.day .rw{font-size:12px;color:var(--gold)}
.day .st{font-size:18px;height:22px}
.day.today{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.day.done{background:color-mix(in srgb,var(--ok) 18%,var(--panel2))}
.day.sun{background:linear-gradient(180deg,#5a3a10,var(--panel2))}
.day.sun.done{background:color-mix(in srgb,var(--ok) 25%,#5a3a10)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,5,16,.7);padding:16px}
.sheet{width:min(460px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head h3{font-size:24px}
.sklist{display:grid;gap:6px}
.sk{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel2);font-size:14px}
.sk b{font-family:var(--display);font-weight:400;font-size:15px}
.sk.ult b{color:var(--gold)}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.eqgrid button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px;font-size:24px}
.eqgrid button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hatch{display:grid;justify-items:center;gap:12px;text-align:center;padding:10px 0}
.hatch .egg-ico{font-size:96px;animation:wob .25s infinite alternate}
@keyframes wob{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.reveal{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.2);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-family:var(--display);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">팻 서바이벌</div>
      <div class="res">
        <span class="chip coin">🪙 <b id="coins">0</b></span>
        <span class="chip gem">💎 <b id="gems">0</b></span>
        <span class="chip">⚔️ <b id="stg" style="font-weight:400">1</b>층</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="battle"><span>⚔️</span>전투</button>
      <button class="tab" role="tab" data-tab="eggs"><span>🥚</span>알 부화</button>
      <button class="tab" role="tab" data-tab="pets"><span>🐾</span>내 펫</button>
      <button class="tab" role="tab" data-tab="shop"><span>🛍️</span>상점</button>
      <button class="tab" role="tab" data-tab="daily"><span>📅</span>출석</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- data ----------
const GRADES = {
  N:  {name:'노멀',       mult:1.0, hp:50},
  R:  {name:'레어',       mult:1.3, hp:60},
  RR: {name:'레어레어',   mult:1.7, hp:75},
  SR: {name:'슈퍼레어',   mult:2.2, hp:95},
  MR: {name:'마스터레어', mult:2.8, hp:120},
};
const ELEM = {불:'#ff7a45',물:'#4fb3ff',풀:'#5bd17a',땅:'#c49a6c',바람:'#8fe3cf',번개:'#ffd84d',얼음:'#a8e6ff',빛:'#fff0a0',어둠:'#8a6bd8'};
const PETS = [
  [1,'솜뭉치','🐑','N','바람',['솜털 박치기','폭신 회오리','구름 폭탄']],
  [2,'도토리쥐','🐿️','N','땅',['도토리 던지기','앞니 갉기','도토리 소나기']],
  [3,'이슬개구리','🐸','N','물',['혀 채찍','물방울 튕기기','연못 대해일']],
  [4,'불씨병아리','🐤','N','불',['불씨 쪼기','따끈 날갯짓','작은 태양']],
  [5,'이끼거북','🐢','N','풀',['등껍질 굴리기','이끼 덩굴','숲의 등껍질']],
  [6,'바람여우','🦊','R','바람',['질풍 할퀴기','꼬리 돌풍','아홉 꼬리 폭풍']],
  [7,'달빛부엉이','🦉','R','어둠',['그림자 깃털','한밤의 울음','월식']],
  [8,'가시고슴도치','🦔','R','땅',['가시 발사','몸말아 구르기','천 개의 가시']],
  [9,'천둥벌','🐝','R','번개',['전기 침','윙윙 방전','벌떼 낙뢰']],
  [10,'서리늑대','🐺','RR','얼음',['얼음 이빨','서리 울부짖음','절대 영도']],
  [11,'화염도마뱀','🦎','RR','불',['불꽃 혀','용암 꼬리','화산 분화']],
  [12,'심해문어','🐙','RR','물',['먹물 분사','여덟 다리 연타','심해의 소용돌이']],
  [13,'숲의사슴','🦌','RR','풀',['뿔 돌진','꽃잎 칼날','세계수의 분노']],
  [14,'수정나비','🦋','RR','빛',['반짝 가루','수정 날개','프리즘 폭발']],
  [15,'그림자고양이','🐈','RR','어둠',['그림자 할퀴기','순간이동 습격','아홉 목숨의 저주']],
  [16,'폭풍매','🦅','RR','바람',['급강하','칼날 깃털','하늘 가르기']],
  [17,'용암게','🦀','RR','불',['집게 분쇄','마그마 거품','용암 대분출']],
  [18,'별빛오징어','🦑','RR','빛',['별빛 촉수','은하 먹물','유성우']],
  [19,'황금사자','🦁','RR','빛',['황금 발톱','사자후','왕의 심판']],
  [20,'얼음유니콘','🦄','SR','얼음',['서리 뿔','빙결 질주','오로라 레퀴엠']],
  [21,'천둥호랑이','🐅','SR','번개',['뇌전 발톱','번개 포효','천벌의 낙뢰']],
  [22,'바다뱀왕','🐍','SR','물',['맹독 송곳니','해일 휘감기','대양의 심판']],
  [23,'무지개공작','🦚','SR','빛',['일곱빛 깃','현혹의 춤','무지개 대폭발']],
  [24,'태초룡','🐉','MR','불',['용의 숨결','비늘 폭풍','태초의 불꽃']],
  [25,'심연고래','🐋','MR','물',['심연 파동','고래의 노래','대심연 붕괴']],
  [26,'시간의 폭군','🦖','MR','땅',['시간 깨물기','지각 변동','멸종의 운석']],
].map(([id,name,emo,grade,el,sk]) => ({id,name,emo,grade,el,sk}));
const PET = Object.fromEntries(PETS.map(p => [p.id,p]));

const EGGS = {
  normal:  {name:'일반 알', ico:'🥚', price:50,  rates:[['N',.60],['R',.30],['RR',.10]]},
  premium: {name:'고급 알', ico:'🥚', price:200, rates:[['RR',.60],['SR',.30],['MR',.10]]},
};
const pool = egg => PETS.filter(p => egg.rates.some(r => r[0] === p.grade));

const ITEMS = [
  [1,'황금 왕관','👑','head'],[2,'신사 모자','🎩','head'],[3,'학사모','🎓','head'],[4,'분홍 리본','🎀','head'],
  [5,'벚꽃 핀','🌸','head'],[6,'별 머리띠','⭐','head'],[7,'깃털 장식','🪶','head'],
  [8,'선글라스','🕶️','face'],[9,'동그란 안경','👓','face'],
  [10,'마법 지팡이','🪄','hand'],[11,'작은 방패','🛡️','hand'],[12,'행운 클로버','🍀','hand'],
  [13,'불꽃 오라','🔥','aura','#ff7a45'],[14,'눈꽃 오라','❄️','aura','#a8e6ff'],[15,'무지개 오라','🌈','aura','#ff6be6'],
].map(([id,name,emo,slot,glow]) => ({id,name,emo,slot,glow}));
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id,i]));
const SLOT = {head:'머리',face:'얼굴',hand:'손',aura:'오라'};
const ITEM_PRICE = 25;

const MONS = [
  ['초록 슬라임','👾'],['숲 고블린','👺'],['해골 병사','💀'],['굶주린 좀비','🧟'],['동굴 박쥐','🦇'],
  ['늪지 오우거','👹'],['독전갈','🦂'],['거미 여왕','🕷️'],['떠도는 망령','👻'],['검은 마녀','🧙'],
  ['고대 골렘','🗿'],['피의 뱀파이어','🧛'],['산악 트롤','🧌'],['늪 악어왕','🐊'],['어둠의 마왕','😈'],
];
const monFor = s => { const [name,emo] = MONS[(s-1) % MONS.length]; return {name,emo,hp:50 + 5*(s-1),atk:3 + Math.floor(s*0.6)}; };

const SKILL_CD = [1, 3, 10];
function skills(p){
  const m = GRADES[p.grade].mult;
  const base = [5 + p.id%3, 9 + p.id%4, 28 + (p.id%5)*2];
  return p.sk.map((name,i) => ({name, dmg:Math.round(base[i]*m), cd:SKILL_CD[i], ult:i===2}));
}

// ---------- state ----------
const KEY = 'pet-survival-v1';
const fresh = () => ({coins:100, gems:0, stage:1, pets:{}, active:null, items:[], equip:{}, daily:{week:'',days:[0,0,0,0,0,0,0]}});
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function avatar(p, size='md', itemId){
  const it = ITEM[itemId];
  const aura = it && it.slot === 'aura' ? `--aura:0 0 26px 6px ${it.glow};` : '';
  return `<div class="av ${size}" style="--el:${ELEM[p.el]};${aura}"><span class="av-emo">${p.emo}</span>${it ? `<span class="acc acc-${it.slot}">${it.emo}</span>` : ''}</div>`;
}
const gradeTag = g => `<span class="grade g-${g}">${GRADES[g].name}</span>`;
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }
function hud(){
  $('#coins').textContent = S.coins; $('#gems').textContent = S.gems; $('#stg').textContent = S.stage;
  const dailyTab = document.querySelector('[data-tab="daily"]');
  dailyTab.querySelector('.dot')?.remove();
  if (!claimedToday()) dailyTab.insertAdjacentHTML('beforeend','<i class="dot"></i>');
}
function openModal(html){ const m = $('#modal'); m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; }
function closeModal(){ $('#modal').hidden = true; $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ---------- daily ----------
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayIdx = () => (new Date().getDay() + 6) % 7; // 월=0 … 일=6
function weekKey(){ const d = new Date(); d.setDate(d.getDate() - dayIdx()); return ymd(d); }
function syncWeek(){ const k = weekKey(); if (S.daily.week !== k) { S.daily = {week:k, days:[0,0,0,0,0,0,0]}; save(); } }
const claimedToday = () => { syncWeek(); return !!S.daily.days[dayIdx()]; };
const perfectWeek = () => S.daily.days.slice(0,6).every(Boolean);
const todayReward = () => dayIdx() === 6 && perfectWeek() ? 200 : 55;

// ---------- tabs ----------
let tab = 'battle';
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  if (B.running && b.dataset.tab !== 'battle') { stopBattle(); toast('전투에서 후퇴했어요'); }
  tab = b.dataset.tab; render();
});
function render(){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  ({battle:renderBattle, eggs:renderEggs, pets:renderPets, shop:renderShop, daily:renderDaily})[tab]();
  hud();
}

// ---------- battle ----------
const B = {running:false, petHp:0, petMax:0, monHp:0, ready:[0,0,0], nextAtk:0, raf:0, result:null};
function renderBattle(){
  const m = monFor(S.stage);
  const p = PET[S.active];
  if (!p){
    $('#main').innerHTML = `<div class="panel"><div class="card empty">
      <div class="egg-ico" style="font-size:72px">🥚</div>
      <h2 style="font-size:24px">아직 함께 싸울 펫이 없어요</h2>
      <p class="sub">알을 부화해서 첫 펫을 얻으세요. 시작 코인 100개로 일반 알 2개를 살 수 있어요.</p>
      <button class="btn" data-go="eggs">알 부화하러 가기</button></div></div>`;
    return;
  }
  const sk = skills(p);
  if (!B.running && !B.result){ B.petMax = GRADES[p.grade].hp; B.petHp = B.petMax; B.monHp = m.hp; }
  $('#main').innerHTML = `<div class="panel">
    <div class="stagebar"><h2>스테이지 ${S.stage}</h2><span class="sub">처치 보상 🪙50 · 💎5</span></div>
    <div class="arena" id="arena">
      <div class="fighter mon" id="monF">
        <div class="mon-emo" id="monE">${m.emo}</div>
        <div class="fname">${m.name}</div>
        <div class="hpbar"><i id="monBar"></i></div>
        <div class="hptxt" id="monTxt"></div>
        <div class="hptxt">공격력 ${m.atk} · 2초마다</div>
      </div>
      <div class="fighter pet" id="petF">
        ${avatar(p,'md',S.equip[p.id])}
        <div class="fname">${p.name} ${gradeTag(p.grade)}</div>
        <div class="hpbar"><i id="petBar"></i></div>
        <div class="hptxt" id="petTxt"></div>
      </div>
      <div id="arenaOver"></div>
    </div>
    <div class="skills">${sk.map((s,i) => `
      <button class="skill ${s.ult?'ult':''}" data-skill="${i}" id="sk${i}">
        <span class="k">${i+1}</span>
        <span class="n">${s.ult?'⚡ ':''}${esc(s.name)}</span>
        <span class="d">피해 ${s.dmg} · ${s.ult?'궁극기 · ':''}${s.cd}초</span>
        <span class="cd" id="cd${i}"></span>
      </button>`).join('')}
    </div>
    <p class="sub" style="text-align:center">키보드: 1 · 2 · 3 으로 스킬 사용, 스페이스로 전투 시작</p>
  </div>`;
  drawBars(); drawOverlay(); drawCooldowns(performance.now());
}
function drawBars(){
  const m = monFor(S.stage);
  const mb = $('#monBar'); if (!mb) return;
  mb.style.width = Math.max(0, B.monHp/m.hp*100) + '%';
  $('#monTxt').textContent = `HP ${Math.max(0,Math.ceil(B.monHp))} / ${m.hp}`;
  $('#petBar').style.width = Math.max(0, B.petHp/B.petMax*100) + '%';
  $('#petTxt').textContent = `HP ${Math.max(0,Math.ceil(B.petHp))} / ${B.petMax}`;
}
function drawOverlay(){
  const o = $('#arenaOver'); if (!o) return;
  if (B.running){ o.innerHTML = ''; return; }
  if (B.result === 'win'){
    o.innerHTML = `<div class="over"><h3 style="color:var(--gold)">승리!</h3>
      <div class="sub" style="color:var(--ink);font-size:18px">🪙 +50 · 💎 +5</div>
      <button class="btn" data-act="start">스테이지 ${S.stage} 도전</button></div>`;
  } else if (B.result === 'lose'){
    o.innerHTML = `<div class="over"><h3 style="color:var(--hp)">패배…</h3>
      <div class="sub">더 강한 펫으로 바꾸거나 다시 도전해 보세요</div>
      <div class="row" style="justify-content:center"><button class="btn" data-act="start">다시 도전</button><button class="btn alt" data-go="pets">펫 바꾸기</button></div></div>`;
  } else {
    o.innerHTML = `<div class="over"><h3>${monFor(S.stage).name} 등장!</h3>
      <div class="sub">스킬을 눌러 공격하세요. 몬스터도 반격해요.</div>
      <button class="btn" data-act="start">전투 시작</button></div>`;
  }
}
function startBattle(){
  const p = PET[S.active]; if (!p) return;
  B.result = null; B.running = true;
  B.petMax = GRADES[p.grade].hp; B.petHp = B.petMax; B.monHp = monFor(S.stage).hp;
  const now = performance.now(); B.ready = [now, now, now]; B.nextAtk = now + 2000;
  renderBattle();
  cancelAnimationFrame(B.raf); B.raf = requestAnimationFrame(loop);
}
function stopBattle(){ B.running = false; B.result = null; cancelAnimationFrame(B.raf); }
function floatAt(el, text, cls=''){
  if (!el) return;
  const f = document.createElement('span'); f.className = 'float ' + cls; f.textContent = text;
  el.appendChild(f); setTimeout(() => f.remove(), 900);
}
function anim(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function loop(now){
  if (!B.running) return;
  const m = monFor(S.stage);
  if (now >= B.nextAtk){
    B.nextAtk += 2000;
    const dmg = Math.round(m.atk * (0.85 + Math.random()*0.3));
    B.petHp -= dmg;
    anim($('#monE'),'lunge'); anim($('#petF'),'hit'); floatAt($('#petF'), '-' + dmg, 'hurt');
    drawBars();
    if (B.petHp <= 0){ B.running = false; B.result = 'lose'; drawOverlay(); drawCooldowns(now); return; }
  }
  drawCooldowns(now);
  B.raf = requestAnimationFrame(loop);
}
function drawCooldowns(now){
  const p = PET[S.active]; if (!p) return;
  skills(p).forEach((s,i) => {
    const cd = $('#cd'+i), btn = $('#sk'+i); if (!cd) return;
    const left = B.running ? Math.max(0, B.ready[i] - now) : 0;
    cd.style.setProperty('--p', (left / (s.cd*1000) * 360) + 'deg');
    cd.textContent = left > 0 && s.ult ? Math.ceil(left/1000) : '';
    btn.disabled = !B.running || left > 0;
  });
}
function useSkill(i){
  if (!B.running) return;
  const now = performance.now(); if (now < B.ready[i]) return;
  const s = skills(PET[S.active])[i];
  B.ready[i] = now + s.cd*1000;
  const dmg = Math.round(s.dmg * (0.9 + Math.random()*0.2));
  B.monHp -= dmg;
  anim($('#petF'),'lunge'); anim($('#monF'),'hit');
  floatAt($('#monF'), (s.ult ? '⚡' : '-') + dmg, s.ult ? 'big' : '');
  if (s.ult){ const fl = document.createElement('div'); fl.className='flash'; fl.style.background=`radial-gradient(circle,${ELEM[PET[S.active].el]},transparent 70%)`; $('#arena').appendChild(fl); setTimeout(()=>fl.remove(),500); }
  drawBars();
  if (B.monHp <= 0){
    B.running = false; B.result = 'win';
    S.coins += 50; S.gems += 5; S.stage += 1; save(); hud();
    $('.stagebar h2').textContent = `스테이지 ${S.stage-1} 클리어`;
    drawOverlay();
  }
  drawCooldowns(now);
}
document.addEventListener('keydown', e => {
  if (tab !== 'battle' || !$('#modal').hidden) return;
  if (['1','2','3'].includes(e.key)) useSkill(+e.key - 1);
  if (e.key === ' ' && !B.running && PET[S.active]){ e.preventDefault(); startBattle(); }
});

// ---------- eggs ----------
function renderEggs(){
  $('#main').innerHTML = `<div class="panel">
    <div><h2 style="font-size:26px">알 부화</h2><p class="sub">알을 깨면 펫이 나와요. 등급이 높을수록 스킬 피해와 체력이 커요.</p></div>
    <div class="eggs">${Object.entries(EGGS).map(([k,e]) => `
      <div class="card egg ${k}">
        <div class="egg-ico">${e.ico}</div>
        <h3 style="font-size:22px">${e.name}</h3>
        <div class="sub">펫 ${pool(e).length}종 등장</div>
        <div class="rates">${e.rates.map(([g,r]) => `<span>${gradeTag(g)} ${Math.round(r*100)}%</span>`).join('')}</div>
        <button class="btn" data-hatch="${k}" ${S.coins < e.price ? 'disabled' : ''}>🪙 ${e.price} 부화하기</button>
      </div>`).join('')}
    </div>
    <div class="card"><h3 style="font-size:18px">등급별 능력</h3>
      <div class="sklist" style="margin-top:8px">${Object.entries(GRADES).map(([g,v]) => `<div class="sk"><span>${gradeTag(g)}</span><span>스킬 피해 ×${v.mult} · 체력 ${v.hp}</span></div>`).join('')}</div>
    </div>
  </div>`;
}
function hatch(k){
  const e = EGGS[k]; if (S.coins < e.price) return toast('코인이 부족해요');
  S.coins -= e.price;
  let r = Math.random(), g = e.rates[e.rates.length-1][0];
  for (const [gr,p] of e.rates){ if (r < p){ g = gr; break; } r -= p; }
  const choices = PETS.filter(p => p.grade === g);
  const pet = choices[Math.floor(Math.random()*choices.length)];
  const isNew = !S.pets[pet.id];
  S.pets[pet.id] = (S.pets[pet.id] || 0) + 1;
  if (!S.active) S.active = pet.id;
  save(); hud(); renderEggs();
  openModal(`<div class="hatch" id="hatchBox"><div class="egg-ico" ${k==='premium'?'style="filter:hue-rotate(200deg) saturate(2) drop-shadow(0 0 16px var(--g-mr))"':''}>🥚</div><div class="sub">알이 흔들려요…</div></div>`);
  setTimeout(() => {
    const box = $('#hatchBox'); if (!box) return;
    box.innerHTML = `<div class="reveal">${avatar(pet,'lg',S.equip[pet.id])}</div>
      <div>${gradeTag(pet.grade)} ${isNew ? '<span class="grade" style="background:var(--hp)">NEW</span>' : ''}</div>
      <h3 style="font-size:28px">${pet.name}</h3>
      <div class="sub">${isNew ? '새로운 펫을 얻었어요!' : `이미 가진 펫이에요 (보유 ${S.pets[pet.id]})`}</div>
      <div class="row" style="justify-content:center">
        ${S.coins >= e.price ? `<button class="btn" data-hatch="${k}">한 번 더 (🪙${e.price})</button>` : ''}
        <button class="btn alt" data-close>확인</button>
      </div>`;
  }, 1200);
}

// ---------- pets ----------
let petFilter = 'all';
function renderPets(){
  const owned = PETS.filter(p => S.pets[p.id]).length;
  const list = PETS.filter(p => petFilter === 'all' || (petFilter === 'own' ? S.pets[p.id] : p.grade === petFilter));
  $('#main').innerHTML = `<div class="panel">
    <div><h2 style="font-size:26px">내 펫 도감 <span class="sub" style="font-size:16px">${owned} / ${PETS.length}</span></h2>
    <p class="sub">펫을 눌러 스킬을 보고, 전투에 내보내거나 아이템으로 꾸밀 수 있어요.</p></div>
    <div class="filters">${[['all','전체'],['own','보유'],...Object.entries(GRADES).map(([g,v])=>[g,v.name])].map(([k,l]) => `<button data-filter="${k}" aria-pressed="${petFilter===k}">${l}</button>`).join('')}</div>
    <div class="grid">${list.map(p => {
      const n = S.pets[p.id];
      return n ? `<button class="pcell ${S.active===p.id?'active':''}" data-pet="${p.id}">
          <span class="cnt">×${n}</span>${avatar(p,'sm',S.equip[p.id])}<span class="nm">${p.name}</span>${gradeTag(p.grade)}</button>`
        : `<div class="pcell unknown">${avatar(p,'sm')}<span class="nm">???</span>${gradeTag(p.grade)}</div>`;
    }).join('') || '<p class="sub">해당하는 펫이 없어요.</p>'}</div>
  </div>`;
}
function petModal(id){
  const p = PET[id], eq = S.equip[id];
  openModal(`<div class="sheet-head">${avatar(p,'md',eq)}<div><h3>${p.name}</h3><div>${gradeTag(p.grade)} <span class="sub">${p.el} 속성 · 체력 ${GRADES[p.grade].hp}</span></div></div></div>
    <div class="sklist">${skills(p).map(s => `<div class="sk ${s.ult?'ult':''}"><b>${s.ult?'⚡ 궁극기 · ':'기술 · '}${esc(s.name)}</b><span>피해 ${s.dmg} · ${s.cd}초</span></div>`).join('')}</div>
    <div><h3 style="font-size:17px">꾸미기</h3>
      ${S.items.length ? `<div class="eqgrid" style="margin-top:8px"><button data-equip="0" aria-pressed="${!eq}" title="벗기기" style="font-size:16px">없음</button>${S.items.map(i => `<button data-equip="${i}" aria-pressed="${eq===i}" title="${ITEM[i].name}">${ITEM[i].emo}</button>`).join('')}</div>`
        : `<p class="sub">아직 아이템이 없어요. 상점에서 보석으로 살 수 있어요.</p>`}
    </div>
    <div class="row">${S.active===id ? '<button class="btn" disabled>전투 중인 펫</button>' : `<button class="btn" data-activate="${id}">전투에 내보내기</button>`}<button class="btn alt" data-close>닫기</button></div>`);
  $('#modal').dataset.pet = id;
}

// ---------- shop ----------
function renderShop(){
  $('#main').innerHTML = `<div class="panel">
    <div><h2 style="font-size:26px">꾸미기 상점</h2><p class="sub">모든 아이템은 💎${ITEM_PRICE}. 한 번 사면 모든 펫에게 씌울 수 있어요. 보석은 몬스터를 처치하면 5개씩 받아요.</p></div>
    <div class="items">${ITEMS.map(it => {
      const own = S.items.includes(it.id);
      return `<div class="item"><div class="ie">${it.emo}</div><div class="nm">${it.name}</div><div class="slot">${SLOT[it.slot]} 장식</div>
        ${own ? '<button class="btn sm alt" disabled>보유 중</button>' : `<button class="btn sm" data-buy="${it.id}" ${S.gems<ITEM_PRICE?'disabled':''}>💎 ${ITEM_PRICE}</button>`}</div>`;
    }).join('')}</div>
  </div>`;
}
function buy(id){
  if (S.items.includes(id)) return;
  if (S.gems < ITEM_PRICE) return toast('보석이 부족해요');
  S.gems -= ITEM_PRICE; S.items.push(id); save(); renderShop(); hud();
  toast(`${ITEM[id].name}을(를) 샀어요! 내 펫에서 꾸며 보세요`);
}

// ---------- daily ----------
function renderDaily(){
  syncWeek();
  const t = dayIdx(), names = ['월','화','수','목','금','토','일'], done = claimedToday();
  $('#main').innerHTML = `<div class="panel">
    <div><h2 style="font-size:26px">일일 출석 보상</h2><p class="sub">매일 🪙55를 받아요. 월요일부터 토요일까지 하루도 빠지지 않으면 일요일에 🪙200!</p></div>
    <div class="card"><div class="week">${names.map((n,i) => `
      <div class="day ${i===6?'sun':''} ${S.daily.days[i]?'done':''} ${i===t?'today':''}">
        <span class="dn">${n}</span><span class="st">${S.daily.days[i]?'✅':(i<t?'✖️':'🎁')}</span>
        <span class="rw">${i===6?'200':'55'}</span></div>`).join('')}</div>
      <p class="sub" style="margin-top:12px">${t===6 ? (perfectWeek() ? '이번 주 개근! 오늘은 200코인이에요.' : '이번 주에 빠진 날이 있어서 오늘은 55코인이에요.') : (S.daily.days.slice(0,t).every(Boolean) ? '지금까지 개근 중이에요. 일요일 200코인까지 화이팅!' : '이번 주는 빠진 날이 있어 일요일 보상이 55코인이에요.')}</p>
    </div>
    <button class="btn" data-claim ${done?'disabled':''}>${done ? '오늘 보상을 받았어요' : `오늘 보상 받기 🪙${todayReward()}`}</button>
  </div>`;
}
function claim(){
  if (claimedToday()) return;
  const r = todayReward(); S.daily.days[dayIdx()] = 1; S.coins += r; save(); renderDaily(); hud();
  toast(`출석 완료! 🪙${r} 받았어요`);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.go){ tab = d.go; closeModal(); render(); }
  else if (d.act === 'start') startBattle();
  else if (d.skill) useSkill(+d.skill);
  else if (d.hatch){ closeModal(); hatch(d.hatch); }
  else if (d.filter){ petFilter = d.filter; renderPets(); }
  else if (d.pet) petModal(+d.pet);
  else if (d.activate){ if (B.running) stopBattle(); B.result = null; S.active = +d.activate; save(); closeModal(); renderPets(); toast(`${PET[S.active].name}이(가) 전투에 나가요`); }
  else if (d.equip !== undefined){
    const pid = +$('#modal').dataset.pet, iid = +d.equip;
    if (iid) S.equip[pid] = iid; else delete S.equip[pid];
    save(); petModal(pid); if (tab === 'pets') renderPets();
  }
  else if (d.buy) buy(+d.buy);
  else if (d.claim !== undefined) claim();
  else if (d.close !== undefined) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
</script>
